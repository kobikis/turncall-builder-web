name: Publish

# Images on ghcr.io, for the Helm chart (kobikis/turncall-charts):
#   a merge to main  -> :main and :sha-<commit>, so the newest code is pullable
#   a tag v1.2.3     -> :1.2.3, :1.2 and :latest; the chart pins these
# The console: nginx serving the build, proxying /api to builder-api.
# amd64 and arm64 — it is small, so QEMU is minutes.
on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/turncall-builder-web
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Links each package to this repo, so it inherits its access.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=turncall-builder-web
          cache-to: type=gha,mode=max,scope=turncall-builder-web
